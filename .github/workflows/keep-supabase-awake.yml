name: Keep Supabase awake

# Supabase pauses free projects after 7 days without activity.
# This runs a tiny database read every 3 days so the project never sits idle.
# If the ping fails, the run fails and GitHub emails the repo owner.

on:
  schedule:
    - cron: "17 6 */3 * *" # 06:17 UTC on every 3rd day of the month
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  actions: write # needed to keep this scheduled workflow switched on

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Public values, the same ones already in public/flowmeter.html.
      # Only the publishable key, never a secret key.
      SUPABASE_URL: https://tdgufuwotovstrkbllwm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_9DKBpd2B0d31DFNTAP1rUw_NuKuOhn5
    steps:
      - name: Read one row from the database
        run: |
          # Signed out, row level security returns an empty list, but the query still runs in Postgres.
          code=$(curl -sS -o body.json -w "%{http_code}" --retry 3 --retry-delay 20 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/blocks?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase answered HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer (HTTP $code). The project may be paused: restore it at https://supabase.com/dashboard/project/tdgufuwotovstrkbllwm"
            cat body.json || true
            exit 1
          fi

      - name: Keep this schedule switched on
        # GitHub turns off scheduled workflows in public repos after 60 days without commits.
        # Re-enabling it on every run resets that clock, so the ping never silently stops.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-supabase-awake.yml/enable"
